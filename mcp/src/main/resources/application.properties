# ==============================================================================
# IPED Tools MCP — Quarkus Configuration
# ==============================================================================

# Application metadata
quarkus.application.name=iped-tools-mcp
quarkus.application.version=${project.version}
quarkus.banner.enabled=false

# Package type: Uber-JAR
quarkus.package.jar.type=uber-jar

# MCP Server STDIO Transport configuration
quarkus.mcp.server.stdio.enabled=true
quarkus.mcp.server.stdio.initialization-enabled=true

# CRITICAL: Prevent accidental System.out prints from corrupting the JSON-RPC stream
quarkus.mcp.server.stdio.null-system-out=true

# Route all console logs to stderr
quarkus.log.console.stderr=true

# Log format
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# ==============================================================================
# PCBA
# ==============================================================================
# Modo somente leitura: a IA não vê nem consegue usar ferramentas que alteram o caso
# (add_to_bookmark, set_item_checked). Para liberar: -Dpcba.somente-leitura=false
pcba.somente-leitura=true
# Pasta do log de auditoria. Vazio = junto do caso (<caso>/iped-pcba-auditoria/),
# ou ~/.iped-pcba/auditoria/ quando a pasta do caso não aceita gravação.
pcba.auditoria.pasta=${PCBA_AUDITORIA_PASTA:}
# Guardar o texto das respostas no log (por padrão só o tamanho e o SHA-256).
pcba.auditoria.guardar-respostas=false
pcba.transporte=stdio
pcba.http.token=${PCBA_MCP_TOKEN:}

# Modo STDIO (padrão): nenhuma porta de rede é aberta.
quarkus.http.host-enabled=false
quarkus.http.host=127.0.0.1
quarkus.http.port=8765

# Modo HTTP (--http): servidor central. Endpoint em /mcp.
%http.pcba.transporte=http
%http.quarkus.http.host-enabled=true
%http.quarkus.mcp.server.stdio.enabled=false
%http.quarkus.mcp.server.stdio.null-system-out=false
